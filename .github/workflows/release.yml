name: Publish npm and release assets
on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable version tag (for example v0.1.4)
        required: true
        type: string
permissions:
  contents: write
  id-token: write
concurrency:
  group: npm-release-${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm install --global npm@latest pnpm@11.7.0
      - name: Validate release identity
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          if (!/^v\d+\.\d+\.\d+$/.test(process.env.RELEASE_TAG) || process.env.RELEASE_TAG !== `v${pkg.version}`) throw new Error('Stable release tag must match package version');
          if (pkg.name !== '@h2mzzz/dsh-openai-subscription' || pkg.private) throw new Error('Unexpected or private package');
          const commit = (ref) => execFileSync('git', ['rev-parse', '--verify', `${ref}^{commit}`], { encoding: 'utf8' }).trim();
          if (commit(`refs/tags/${process.env.RELEASE_TAG}`) !== commit('HEAD')) throw new Error('Release tag must point to the checked-out commit');
          if (!readFileSync(`docs/RELEASE_NOTES_${process.env.RELEASE_TAG}.md`, 'utf8').trim()) throw new Error('Release notes are required');
          JS
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:package
      - run: pnpm test:compatibility
      - run: npm pack --dry-run && git diff --check
      - name: Publish if version is absent
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const response = await fetch(`https://registry.npmjs.org/${encodeURIComponent(pkg.name)}/${pkg.version}`, { signal: AbortSignal.timeout(30000) });
          if (response.status === 404) execFileSync('npm', ['publish', '--access', 'public', '--registry=https://registry.npmjs.org/'], { stdio: 'inherit' });
          else if (!response.ok) throw new Error(`Registry lookup failed: ${response.status}`);
          else console.log('Version already published; synchronize existing registry artifact.');
          JS
      - name: Ensure GitHub Release exists
        run: |
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$RELEASE_TAG" --notes-file "docs/RELEASE_NOTES_${RELEASE_TAG}.md"
          fi
      - name: Attach exact npm artifact
        run: |
          mkdir -p artifacts
          SPEC=$(node -p "const p=require('./package.json'); p.name+'@'+p.version")
          npm pack "$SPEC" --ignore-scripts --registry=https://registry.npmjs.org/ --pack-destination artifacts
          cd artifacts
          sha256sum *.tgz > SHA256SUMS
          gh release upload "$RELEASE_TAG" ./*.tgz SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
          cat SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
